<!DOCTYPE html>
<html>
<head>
    <title>CyberBuddy Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body data-username="{{ current_user.username if current_user.is_authenticated else '' }}"></body>

<div class="container quiz-container">
    <h1>🧠 CyberBuddy Quiz</h1>
    <div class="tagline">Test your cyber safety skills and become a digital hero! 🏆</div>

   
    <a href="/" class="nav-btn secondary-btn">⬅ Back to Chat</a>
    <br>
    <br>
    <br>
<div id="levelSelector" class="level-selector">
    <h2>Pick Your Level 🚀</h2>
    <p class="level-subtitle">Choose how hard you want the quiz to be.</p>

    <div class="level-buttons">
        <button class="level-btn easy" onclick="startLevel('easy')">🌟 Easy</button>
        <button class="level-btn medium" onclick="startLevel('medium')">⚡ Medium</button>
        <button class="level-btn hard" onclick="startLevel('hard')">🔥 Hard</button>
    </div>
</div>

<div id="quizGame" style="display: none;">
    
    <div class="quiz-status">
        <span id="questionCounter">Question 1 of 10</span>
        <span id="scoreDisplay">Score: 0</span>
    </div>

    <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
    </div>

    <div class="quiz-box">
        <h2 id="quizQuestion">Loading question...</h2>
        <div id="quizOptions" class="quiz-options"></div>
        <div id="quizFeedback" class="quiz-feedback"></div>
    </div>
    </div>

    <div class="quiz-box" style="margin-top: 20px;">
    <h2>🏆 Leaderboard</h2>
    <div id="leaderboardContainer">
        <p>Loading leaderboard...</p>
    </div>
</div>
</div>

<script src="/static/quiz.js"></script>

</body>
</html>
