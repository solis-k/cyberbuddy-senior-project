<!DOCTYPE html>
<html>
<head>
    <title>CyberBuddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body data-username="{{ username }}">


<div class="container">
    <h1>🤖 CyberBuddy</h1>
    <div class="top-buttons">
        <button id="loginBtn" class="nav-btn">Login</button>
        <a href="/" class="nav-btn">Chat</a>
        <a href="/quiz" class="nav-btn secondary-btn">Quiz</a>
    </div>
    <div class="tagline">Your fun digital buddy for staying safe online! 🛡✨</div>

    <div id="chatbox" class="chatbox">

        {% if name %}
            <div class="bot">
                <div class="bubble">
                    👋 Hi {{ name }}! What would you like to learn today?
                </div>
            </div>
        {% else %}
            <div class="bot">
                <div class="bubble">
                    👋 Hi there! I'm CyberBuddy 🤖  
                    What would you like to learn today?
                </div>
            </div>
        {% endif %}

        <div class="topic-buttons">
            <button onclick="selectTopic('phishing')" data-tooltip="Phishing tricks people. Watch out for fake emails!">🎣 Phishing</button>
            <button onclick="selectTopic('passwords')" data-tooltip="Keep your passwords strong and unique!">🔑 Password Safety</button>
            <button onclick="selectTopic('viruses')" data-tooltip="Protect yourself from malicious software!">🦠 Virus Protection</button>
            <button onclick="selectTopic('social')" data-tooltip="Stay safe on social media!">📱 Social Media Safety</button>
            <button onclick="selectTopic('data')" data-tooltip="Protect your personal information!">🔒 Data Privacy</button>
            <button onclick="selectTopic('ai')" data-tooltip="Understand how AI works and how to use it safely and wisely!">🤖 AI Safety</button>
            <button onclick="enableFreeChat()" data-tooltip="Ask me anything about online safety!">💬 Ask My Own Question</button>
        </div>

    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask me how to stay safe online! 😊">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<div id="loginModal" class="modal">

  <div class="modal-content">
    <span id="closeLogin">&times;</span>

    <h2>Login</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="loginUser()">Login</button>

    <h2>Create Account</h2>

    <input id="registerName" placeholder="Your Name">
    <input id="registerUsername" placeholder="Username">
    <input id="registerPassword" type="password" placeholder="Password">

    <button onclick="registerUser()">Create Account</button>

  </div>

</div>


<script src="/static/script.js"></script>

</body>
</html>
