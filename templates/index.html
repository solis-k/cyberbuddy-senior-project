<!DOCTYPE html>
<html>
<head>
    <title>CyberBuddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(to bottom right, #c7f0ff, #e0ffe6);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2b7a78;
        }

        .chatbox {
            height: 350px;
            overflow-y: auto;
            background: #f4faff;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .message-user {
            text-align: right;
            margin: 10px 0;
        }

        .message-bot {
            text-align: left;
            margin: 10px 0;
        }

        .bubble {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 20px;
            max-width: 75%;
        }

        .user-bubble {
            background-color: #4dabf7;
            color: white;
        }

        .bot-bubble {
            background-color: #d3f9d8;
            color: #2b7a78;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 15px;
            border: 2px solid #2b7a78;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            border-radius: 15px;
            border: none;
            background-color: #2b7a78;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #205e5d;
        }

        .tagline {
            text-align: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡 CyberBuddy</h1>
    <div class="tagline">
        Your friendly guide to staying safe online!
    </div>

    <div id="chatbox" class="chatbox"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask me about staying safe online! 😊">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
