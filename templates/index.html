<!DOCTYPE html>
<html>
<head>
    <title>CyberBuddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body data-username="{{ username }}">


<div class="container">
    <h1>🤖 CyberBuddy</h1>
    <div class="top-buttons">
        <button id="loginBtn">Login</button>
        <a href="/" class="nav-btn">Chat</a>
        <a href="/quiz" class="nav-btn secondary-btn">Quiz</a>
    </div>
    <div class="tagline">Your fun digital buddy for staying safe online! 🛡✨</div>

    <div id="chatbox" class="chatbox">
        {% if username %}
            <div class="bot-message">
                👋 Hi {{ username }}! I'm CyberBuddy. Ready to stay safe online today?
            </div>
        {% endif %}
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask me how to stay safe online! 😊">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<div id="loginModal" class="modal">

  <div class="modal-content">
    <span id="closeLogin">&times;</span>

    <h2>Login</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="loginUser()">Login</button>

    <h2>Create Account</h2>

    <input id="registerUsername" placeholder="Username">
    <input id="registerPassword" type="password" placeholder="Password">

    <button onclick="registerUser()">Create Account</button>

  </div>

</div>


<script src="/static/script.js"></script>

</body>
</html>
