<!DOCTYPE html>
<html lang ="eng">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberBuddy - Your AI Bestie for Online Safety</title>
    <link rel="stylesheet" href="/static/style.css">
     <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
        body {
            background-color: #0f172a;
            color: white;
        }
        .chat-container {
            max-width: 800px;
            margin: 50px auto;
        }
        .chatbox {
            height: 400px;
            overflow-y: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }
        .message-user {
            text-align: right;
            margin-bottom: 10px;
        }
        .message-bot {
            text-align: left;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container chat-container">
    <h1 class="text-center mb-4">CyberBuddy - Your AI Bestie for Online Safety 🛡️</h1>

    <div id="chatbox" class="chatbox mb-3"></div>

    <div class="input-group">
        <input type="text" id="userInput" class="form-control" placeholder="Ask a cybersecurity question...">
        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
    </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
